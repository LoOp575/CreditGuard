services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credit_guard
      POSTGRES_USER: credit_guard
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - credit_guard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_guard -d credit_guard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  credit_guard_pgdata:
